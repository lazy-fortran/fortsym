name = "fortsym"
version = "0.1.0"
description = "Fortran-native computer algebra, kernel generation, and symbolic verification"
author = "Christopher Albert"
maintainer = "albert@tugraz.at"
license = "MIT"
copyright = "Copyright 2026, lazy-fortran"

[build]
auto-tests = true
# SymEngine (MIT) is the symbolic core, reached through its stable C ABI
# (symengine/cwrapper.h) plus the own-prefix C++ shim under src/capi. GMP backs
# SymEngine's integer class and stdc++ its C++ runtime.
#
# fpm links the system SymEngine; it cannot orchestrate fetching and building a
# C++ numerical library from source. CMake can fetch and build SymEngine while
# GMP remains a system dependency: configure with
# -DFORTSYM_USE_SYSTEM_DEPS=OFF.
# FLINT provides the polynomial GCD behind rational cancellation in the shim,
# and MPFR backs high-precision evaluation. Both are already SymEngine
# dependencies; they are named here because the fpm/fo link line is explicit.
link = ["symengine", "flint", "mpfr", "gmp", "stdc++", "dl"]

[dependencies]
fortgen = { git = "https://github.com/lazy-fortran/fortgen", rev = "d798253805264d7f334249212267212e2c928bdd" }
# Plotting. fortsym samples an expression into arrays and maps options; it
# implements no plotting of its own, and anything missing is fixed upstream in
# fortplot rather than worked around here. See issue #44.
fortplot = { git = "https://github.com/lazy-fortran/fortplot", rev = "1645fa41c11b5786c71bc27e5b41dae7c7bbba23" }

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

# The native consumer-audit test executes these retained Python fixtures.
# Declare them so frozen Gremlin views preserve the actual test inputs.
[[extra.fo.inputs]]
path = "test/audit/test_consumer_audit.py"
role = "test-fixture"

[[extra.fo.inputs]]
path = "scripts/audit_consumer_requirements.py"
role = "test-fixture"
