schema_version = 1
generated_on = "2026-07-29"
evidence_file = "consumer-audit.json"
status_vocabulary = ["implemented", "partial", "missing"]
priority_vocabulary = ["P0", "P1", "P2"]

[privacy]
aggregate_only = true
named_consumers = ["FortNum", "MHD1D"]
repository_names_retained = false
source_paths_retained = false
source_snippets_retained = false

[scope]
local_source_classes = ["local_proj", "local_code"]
local_policy = "Every discoverable Git worktree is inspected; repeated worktrees affect file-instance counts only."
gitlab_policy = "Every project returned by the authenticated visible-project listing."
github_policy = "Every repository returned for owner, collaborator, or organization membership."
remote_policy = "Default-branch trees; empty repositories count as inspected."
candidate_policy = "Wolfram notebooks/packages/scripts plus host-language files found by explicit Mathematica/Wolfram kernel-marker search."
frequency_policy = "Every worktree is inspected, but repository-hit counts are unioned by transient logical repository identity."

[interpretation]
source_classes = "Classes with at least one observed logical-repository hit in consumer-audit.json."
absence = "No hit was observed; it is not a claim of unsupported consumer use because every source class reports incomplete coverage."
priority = "Priority combines observed breadth, FortNum/MHD1D contracts, semantic dependency order, and correctness risk; raw frequency alone does not set priority."

[consumers.FortNum]
source_classes = ["local_code", "github"]
required_operations = [
    "differentiate",
    "parse_print_codegen",
    "simplify",
]
non_operation_requirements = [
    "expression_construction",
    "elementary_functions",
    "substitution",
    "derivative_products",
    "identity_verification",
    "common_subexpression_elimination",
    "stability_rewrites",
    "Enzyme_wrappers",
    "byte_stable_generated_kernels",
]
direct_wolfram_operations_observed = false

[consumers.MHD1D]
source_classes = ["github"]
required_operations = [
    "assumptions_inequalities",
    "differential_equations",
    "differentiate",
    "exact_linear_algebra",
    "expand_collect",
    "fourier_laplace_transforms",
    "integrate",
    "limits_series_asymptotics",
    "parse_print_codegen",
    "polynomial_rational",
    "simplify",
    "solve_reduce",
    "special_functions",
    "trigonometric",
]
direct_wolfram_operations_observed = [
    "arbitrary_precision",
    "assumptions_inequalities",
    "differential_equations",
    "differentiate",
    "expand_collect",
    "integrate",
    "limits_series_asymptotics",
    "matrices_tensors",
    "numeric_differential_equations",
    "numeric_evaluation",
    "parse_print_codegen",
    "polynomial_rational",
    "safe_log_power_radical",
    "simplify",
    "solve_reduce",
    "special_functions",
    "trigonometric",
]
additional_contract_basis = "Existing fortsym MHD1D compatibility documentation adds exact linear algebra and Fourier/Taylor projection requirements."

[[requirement]]
id = "arbitrary_precision"
semantics = "Exact unbounded integers and normalized rationals; requested-precision real evaluation must not silently round through binary64."
priority = "P0"
independent_oracle = "Independently derived large integer/rational identities plus modular residues and exact numerator/denominator reconstruction."
status = "missing"
source_classes = ["local_proj", "local_code", "gitlab", "github"]

[[requirement]]
id = "numeric_evaluation"
semantics = "Requested-precision numerical evaluation with explicit precision/accuracy tracking and no silent round trip through binary64."
priority = "P1"
independent_oracle = "Independently derived high-precision constants and precision-doubling convergence with interval or error-bound checks."
status = "partial"
source_classes = ["local_proj", "local_code", "gitlab", "github"]

[[requirement]]
id = "complex_algebraic"
semantics = "Exact Gaussian rational and algebraic values with explicit principal branches; unsupported root selections return a condition or UNKNOWN."
priority = "P0"
independent_oracle = "Minimal-polynomial substitution and isolating numerical enclosures at precision exceeding the construction precision."
status = "missing"
source_classes = ["local_proj", "gitlab"]

[[requirement]]
id = "differentiate"
semantics = "Exact scalar and multivariate differentiation, including known special-function rules and opaque derivatives for unknown applied functions."
priority = "P0"
independent_oracle = "Closed-form derivatives, dual-number identities, high-order finite differences at safe points, and mixed-partial symmetry."
status = "implemented"
source_classes = ["local_proj", "local_code", "gitlab", "github"]

[[requirement]]
id = "simplify"
semantics = "Deterministic canonical simplification that preserves domains and branches; a smaller expression may win only after equivalence is established."
priority = "P0"
independent_oracle = "Polynomial normal forms where applicable and independently evaluated safe-point plus branch-cut counterexample corpora elsewhere."
status = "partial"
source_classes = ["local_proj", "local_code", "gitlab", "github"]

[[requirement]]
id = "expand_collect"
semantics = "Sparse multivariate expansion, coefficient extraction, collection, and reconstruction without a fixed expression-order limit."
priority = "P0"
independent_oracle = "Exact coefficient-map reconstruction and finite-field evaluations at independently selected points."
status = "partial"
source_classes = ["local_proj", "local_code", "gitlab", "github"]

[[requirement]]
id = "polynomial_rational"
semantics = "Multivariate polynomial arithmetic, GCD, square-free factorization, cancel/together/apart, resultants, and Groebner reduction over exact domains."
priority = "P0"
independent_oracle = "Exact divisibility and reconstruction, Bezout/resultant identities, finite-field specialization, S-polynomial reduction, and bidirectional ideal-membership certificates."
