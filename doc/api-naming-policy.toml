schema_version = 1
package = "fortsym"
sympy_version = "1.14.0"
source_audit = "doc/sympy-api-naming-audit.json"

[policy]
native = "The Fortran facade and its owning native modules use concise, old-school names when the meaning is clear."
python = "fortsym.sympy keeps SymPy-compatible names and signatures, even when the native Fortran name is shorter."
facade = "The convenience facade mirrors the selected native owner. A facade-only alias requires a documented language or compatibility reason."
transition = "The repository is pre-alpha. Current facade names may remain as explicitly marked transition aliases while consumers move to canonical names."
single_responsibility = "Each family has one owning module and one canonical native vocabulary."

[[family]]
id = "constructors"
audit_concepts = ["symbol-construction", "symbol-sequences", "integer-construction", "rational-construction", "real-construction", "function-construction", "exact-and-constant-construction"]
canonical_native = ["sym", "symbols", "num", "rat", "real_expr", "real_text_expr", "exact", "algebraic_expr", "const", "func", "func_in"]
current_native = ["sym", "symbols", "num", "rat", "real_expr", "real_text_expr", "exact", "algebraic_expr", "const", "func", "func_in"]
transition_aliases = []
python_facade = ["Symbol", "symbols", "Integer", "Rational", "Float", "Function"]
sympy_adapter = ["Symbol", "symbols", "Integer", "Rational", "Float", "Function"]
decision = "Keep the short native constructors. Keep func_in distinct because it owns an arena when there are no arguments. Keep real_expr and real_text_expr distinct because their input domains differ."

[[family]]
id = "elementary-functions"
audit_concepts = ["elementary-functions"]
canonical_native = ["sin", "cos", "tan", "asin", "acos", "atan", "atan2", "sinh", "cosh", "tanh", "asinh", "acosh", "atanh", "exp", "log", "sqrt", "abs", "erf", "erfc", "gamma", "besselj", "besseli", "besselk", "legendrep", "legendreq"]
current_native = ["sin", "cos", "tan", "asin", "acos", "atan", "atan2", "sinh", "cosh", "tanh", "asinh", "acosh", "atanh", "exp", "log", "sqrt", "abs", "erf", "erfc", "gamma", "besselj", "besseli", "besselk", "legendrep", "legendreq"]
transition_aliases = []
python_facade = []
sympy_adapter = ["sin", "cos", "tan", "asin", "acos", "atan", "atan2", "sinh", "cosh", "tanh", "csch", "sech", "coth", "erf", "erfc", "gamma", "loggamma", "factorial", "besselj", "besseli", "legendre", "asinh", "acosh", "atanh", "exp", "log", "sqrt"]
decision = "Use the intrinsic spellings in the native facade so it mirrors fortsym_expr. The old _expr spellings are removed rather than retained as a second vocabulary. The adapter maps abs to SymPy Abs."

[[family]]
id = "constants"
audit_concepts = ["constants"]
canonical_native = ["pi_expr", "e_expr", "i_expr", "oo_expr", "zoo_expr", "nan_expr"]
current_native = ["pi_expr", "e_expr", "i_expr", "oo_expr", "zoo_expr", "nan_expr"]
transition_aliases = []
python_facade = []
sympy_adapter = ["pi", "E", "I", "oo", "zoo", "nan"]
decision = "Keep typed expression suffixes for constants because pi, e, i, oo, zoo, and nan are common scalar names or Fortran identifiers. The adapter retains SymPy's lowercase constant names."

[[family]]
id = "complex-domain-functions"
audit_concepts = ["complex-domain-functions"]
canonical_native = ["re_part", "im_part", "abs_of", "conjugate", "arg_of", "complex_expand"]
current_native = ["re_part", "im_part", "abs_of", "conjugate", "arg_of", "complex_expand"]
transition_aliases = []
python_facade = []
sympy_adapter = ["re", "im", "Abs", "expand_complex", "conjugate", "arg"]
decision = "Keep the explicit snake_case projection names in the native facade and lower-level complex-domain owner. Map SymPy's re, im, Abs, expand_complex, conjugate, and arg only in the compatibility adapter; all use one shared operation boundary, with Abs retaining an unevaluated fallback for unknown reality."

[[family]]
id = "calculus"
audit_concepts = ["differentiation"]
canonical_native = ["partial", "diff"]
current_native = ["partial", "diff"]
transition_aliases = []
python_facade = ["diff"]
sympy_adapter = ["diff", "Derivative"]
decision = "partial constructs an unevaluated first-order node. diff owns the evaluated operation. Derivative remains the Python adapter's unevaluated compatibility wrapper."

[[family]]
id = "contexts-and-handles"
audit_concepts = ["arena-and-expression", "assumption-queries"]
canonical_native = ["arena_t", "expr_t", "default_arena", "reset", "assumption_context_t", "make_assumption_context", "with_assumption", "zero", "negative", "nonpositive", "positive", "nonnegative", "nonzero", "real_valued", "rational_valued", "integer_valued", "positive_integer", "assumption_push", "assumption_pop"]
current_native = ["arena_t", "expr_t", "default_arena", "reset", "assumption_context_t", "make_assumption_context", "with_assumption", "zero", "negative", "nonpositive", "positive", "nonnegative", "nonzero", "real_valued", "rational_valued", "integer_valued", "positive_integer", "assumption_push", "assumption_pop"]
transition_aliases = []
python_facade = ["Arena", "Expr"]
sympy_adapter = ["Arena", "Expr", "Q", "ask", "assuming", "And", "InconsistentAssumptions"]
decision = "Keep arena_t and expr_t as type names. Use default_arena and reset in the convenience facade because use fortsym already supplies the namespace. Keep assumption_context_t, make_assumption_context, with_assumption, and the concise sign-fact names as the native vocabulary; assumption_push/pop remain the C/Python scope mechanism. Q, ask, assuming, And, and InconsistentAssumptions remain the SymPy adapter vocabulary."

[[family]]
id = "transformations"
audit_concepts = ["substitution", "transformation-functions"]
canonical_native = ["subs", "subs_many", "expand", "simplify", "refine", "factor"]
current_native = ["subs", "subs_many", "expand", "simplify", "refine", "factor"]
transition_aliases = []
python_facade = ["subs", "subs_many", "factor"]
sympy_adapter = ["subs", "Subs", "xreplace", "replace", "match", "Wild", "expand", "simplify", "refine", "factor"]
decision = "Expose the native operations under the same short names from one facade owner. Keep subs_many as the explicit paired-sequence native spelling, apply SymPy's unordered mapping order, map the simultaneous option, and expose exact-node xreplace, exact non-wildcard replace/match, and bounded Wild patterns at the adapter boundary; keep refine as the named assumption-aware entry point, and keep Subs, xreplace, replace, match, and Wild as adapter-only compatibility surfaces."

[[family]]
id = "operation-count"
audit_concepts = ["operation-count"]
canonical_native = ["operation_count"]
current_native = ["operation_count"]
transition_aliases = []
python_facade = ["operation_count"]
sympy_adapter = ["count_ops"]
decision = "Keep one native tree traversal under operation_count and map only the Python compatibility spelling count_ops; visual operation expressions remain an explicit bounded refusal."

[[family]]
id = "free-symbols"
audit_concepts = ["free-symbols"]
canonical_native = ["free_symbols"]
current_native = ["free_symbols"]
transition_aliases = []
python_facade = ["free_symbols"]
sympy_adapter = ["Expr"]
decision = "Keep free_symbols as the one user-facing native name and reuse the caller-owned collect_free_symbols traversal internally; the SymPy Expr property is a handle-set adapter, not a second walk."

[[family]]
id = "relations"
audit_concepts = ["relational-constructors"]
canonical_native = ["equal", "unequal", "less", "less_equal", "greater", "greater_equal"]
current_native = ["equal", "unequal", "less", "less_equal", "greater", "greater_equal"]
transition_aliases = []
python_facade = []
sympy_adapter = ["Eq", "Ne", "Gt", "Ge", "Lt", "Le", "And", "Or", "Not", "Xor", "Implies", "Equivalent"]
decision = "Keep relational constructors snake_case in the Fortran facade and use its shared generic func owner for Boolean applications. Preserve SymPy's Eq/Ne/Gt/Ge/Lt/Le and And/Or/Not/Xor/Implies/Equivalent spellings only in the compatibility adapter; expression operators use the same application owner, and relation heads such as Greater remain private serialized node names."

[[family]]
id = "predicates"
audit_concepts = ["identity-and-validity", "three-valued-query", "numeric-predicate", "algebraic-predicate"]
canonical_native = ["is_valid", "same_arena", "is_number", "is_algebraic", "zero_test", "assumption_has", "VERDICT_UNKNOWN", "VERDICT_TRUE", "VERDICT_FALSE", "verdict_name"]
current_native = ["is_valid", "same_arena", "is_number", "is_algebraic", "zero_test", "assumption_has", "VERDICT_UNKNOWN", "VERDICT_TRUE", "VERDICT_FALSE", "verdict_name"]
transition_aliases = []
python_facade = []
sympy_adapter = ["Expr.is_number", "Expr.is_algebraic", "Q.algebraic", "Expr.is_rational", "Expr.is_integer", "Expr.is_zero", "Expr.is_nonzero", "Expr.is_real", "Expr.is_positive", "Expr.is_nonnegative", "Expr.is_negative", "Expr.is_nonpositive"]
decision = "Keep structural and safety predicates in one predicate vocabulary. Expose is_number and is_algebraic as native expression queries, zero_test as the native three-valued query, and assumption_has as the native fact query; the SymPy adapter maps them to standard Expr and Q predicate properties, preserving dispatcher-only None boundaries at the adapter edge. Keep check_zero, check_identity, and probe_zero in the testing owner."

[[family]]
id = "results-and-status"
audit_concepts = ["operation-results"]
canonical_native = ["engine_result_t"]
current_native = ["engine_result_t"]
transition_aliases = []
python_facade = []
sympy_adapter = []
decision = "Reuse engine_result_t as the one native result type for facade operations and zero queries, keeping success, values, verdicts, timings, and diagnostics under one contract."

[[family]]
id = "operators-and-assignment"
audit_concepts = ["operator-overloads"]
canonical_native = ["operator(+)" , "operator(-)", "operator(*)", "operator(/)", "operator(**)", "operator(==)", "operator(/=)", "assignment(=)"]
current_native = ["operator(+)" , "operator(-)", "operator(*)", "operator(/)", "operator(**)", "operator(==)", "operator(/=)", "assignment(=)"]
transition_aliases = []
python_facade = []
sympy_adapter = ["Add", "Mul", "Pow"]
decision = "Keep Fortran operators as the native arithmetic vocabulary. Character assignment remains the simple x = 'x' symbol entry point and never parses an expression."

[[family]]
id = "node-kinds"
audit_concepts = ["node-kinds"]
canonical_native = ["node_kind_name", "NK_INT", "NK_RAT", "NK_REAL", "NK_SYM", "NK_CONST", "NK_ADD", "NK_MUL", "NK_POW", "NK_FUNC", "NK_BIG_INT", "NK_BIG_RAT", "NK_BIG_REAL", "NK_ALGEBRAIC"]
current_native = ["node_kind_name", "NK_INT", "NK_RAT", "NK_REAL", "NK_SYM", "NK_CONST", "NK_ADD", "NK_MUL", "NK_POW", "NK_FUNC", "NK_BIG_INT", "NK_BIG_RAT", "NK_BIG_REAL", "NK_ALGEBRAIC"]
transition_aliases = []
python_facade = []
sympy_adapter = []
decision = "Keep representation tags in the low-level owner. They are not part of the SymPy compatibility vocabulary."

[[family]]
id = "string-conversion"
audit_concepts = ["string-conversion"]
canonical_native = ["str", "chars"]
current_native = ["str", "chars"]
transition_aliases = []
python_facade = []
sympy_adapter = []
decision = "Keep str and chars as the one concise string-boundary pair owned by fortsym_string; they are not symbolic constructors or compatibility aliases."

[[family]]
id = "code-generation"
audit_concepts = ["code-generation"]
canonical_native = ["kernel_spec_t", "emit_kernel", "KERNEL_SUBROUTINE"]
current_native = ["kernel_spec_t", "emit_kernel", "KERNEL_SUBROUTINE"]
transition_aliases = []
python_facade = []
sympy_adapter = []
decision = "Keep the kernel specification, emitter, and subroutine mode together under the code-generation owner; do not duplicate backend-evidence names."

[[family]]
id = "numeric-inspection"
audit_concepts = ["numeric-inspection"]
canonical_native = ["numeric_value", "numeric_text", "numeric_precision_text", "numeric_real_text_t", "numeric_complex_text", "numeric_complex_text_t", "numeric_callable_t"]
current_native = ["numeric_value", "numeric_text", "numeric_precision_text", "numeric_real_text_t", "numeric_complex_text", "numeric_complex_text_t", "numeric_callable_t"]
transition_aliases = []
python_facade = []
sympy_adapter = []
decision = "Keep one numeric_ family owned by the numeric verification module. Use one numeric_precision_text generic with character and typed decimal-result overloads. Do not invent SymPy aliases for callback and text-boundary details."

[[family]]
id = "backend-evidence"
audit_concepts = ["backend-evidence", "backend-protocol"]
canonical_native = ["BACKEND_PROTOCOL_VERSION", "EXPRESSION_SCHEMA", "BACKEND_PROVED", "BACKEND_DISPROVED", "BACKEND_UNKNOWN", "backend_evidence_t", "backend_result_t", "backend_status_name", "serialize_expression", "deserialize_expression", "assess_identity", "assess_equivalence", "evidence_json", "emit_backend_kernel"]
current_native = ["BACKEND_PROTOCOL_VERSION", "EXPRESSION_SCHEMA", "BACKEND_PROVED", "BACKEND_DISPROVED", "BACKEND_UNKNOWN", "backend_evidence_t", "backend_result_t", "backend_status_name", "serialize_expression", "deserialize_expression", "assess_identity", "assess_equivalence", "evidence_json", "emit_backend_kernel"]
transition_aliases = []
python_facade = []
sympy_adapter = []
decision = "Keep backend protocol and evidence names together under their owning module. The symbolic facade may call this service but does not duplicate its vocabulary."

[[family]]
id = "ode-solving"
audit_concepts = ["ode-solving"]
canonical_native = ["solve_ode"]
current_native = ["solve_ode"]
transition_aliases = []
python_facade = ["solve_ode"]
sympy_adapter = ["dsolve"]
decision = "Keep solve_ode as the one native calculus owner; expose solve_ode in the convenience facade and adapt SymPy's dsolve spelling at the Python boundary."

[[family]]
id = "inequality-solving"
audit_concepts = ["inequality-solving"]
canonical_native = ["solve_univariate_inequality"]
current_native = ["solve_univariate_inequality"]
transition_aliases = []
python_facade = ["solve_univariate_inequality"]
sympy_adapter = ["solve_univariate_inequality", "reduce_inequalities"]
decision = "Keep solve_univariate_inequality as the single native inequality owner. Expose the same spelling in the convenience facade and adapt SymPy's reduce_inequalities input convention without duplicating the algorithm."

[[family]]
id = "matrix-minors"
audit_concepts = ["matrix-minors"]
canonical_native = ["minor"]
current_native = ["minor"]
transition_aliases = []
python_facade = ["minor"]
sympy_adapter = ["minor", "minor_submatrix"]
decision = "Keep minor as the concise native and low-level Python operation. The SymPy adapter keeps Matrix.minor and Matrix.minor_submatrix names, translating only indices and result shape at the boundary."

[[family]]
id = "sums-and-products"
audit_concepts = ["sums-and-products"]
canonical_native = ["sum_closed_form", "product_closed_form"]
current_native = ["sum_closed_form", "product_closed_form"]
transition_aliases = []
python_facade = ["sum_closed_form", "product_closed_form"]
sympy_adapter = ["summation", "product"]
decision = "Keep the explicit closed-form names in the native facade because the owner may expand, telescope, or issue a closed form; adapt SymPy's summation/product spellings only at the compatibility boundary."
