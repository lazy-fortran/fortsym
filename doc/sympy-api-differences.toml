schema_version = 1
package = "sympy"
version = "1.14.0"
source_classification = "doc/sympy-api-classification.json"

[policy]
semantic = "A semantic difference changes a result, accepted input, condition, exception, evaluation rule, or observable object behaviour."
implementation = "An implementation difference changes representation, ownership, language boundary, backend, resource policy, or execution strategy without being a promised semantic match."
oracle = "SymPy 1.14.0 is the mandatory behavioural and performance reference; independent algebraic, numerical, compiler, and residual checks remain required."
supported_surface = "The affected names below are exactly the root names currently classified as python-adapter."

[[semantic]]
id = "symbol-assumptions-and-symbol-lists"
affected = ["Symbol", "symbols"]
parity = "partial"
sympy = "Symbol accepts SymPy's broad assumption system; symbols also supports range syntax, sequence shapes, and rich options."
fortsym = "The adapter accepts rational, integer, real, zero, negative, nonpositive, positive, nonnegative, and nonzero facts. symbols splits comma or whitespace separated names and returns one expression or a tuple."
difference = "Assumption inference and symbols() input and output forms are intentionally narrower; contradictory sign/zero combinations raise the adapter's InconsistentAssumptions error."

[[semantic]]
id = "three-valued-predicates"
affected = ["Expr", "Expr.is_rational", "Expr.is_integer", "Expr.is_zero", "Expr.is_nonzero", "Expr.is_real", "Expr.is_positive", "Expr.is_nonnegative", "Expr.is_negative", "Expr.is_nonpositive"]
parity = "partial"
sympy = "SymPy exposes assumption-aware three-valued is_zero and is_nonzero properties on expressions."
fortsym = "The adapter uses one native predicate owner for is_number and is_algebraic, native exact-number kind inference for is_rational and is_integer, plus native zero_test and assumption_has queries for the remaining declared predicate properties, returning True, False, or None."
difference = "Only the declared native rational/integer/algebraic/sign/zero facts and decision fragments are covered; the broader SymPy assumption vocabulary and inference rules remain incomplete."

[[semantic]]
id = "scoped-assumptions"
affected = ["Q", "ask", "assuming"]
parity = "partial"
sympy = "SymPy's Q keys, ask(), and assuming() provide assumption propositions, three-valued queries, and nested reversible global scopes."
fortsym = "The adapter supports the declared native Q keys, including Q.algebraic, Q.rational, and Q.integer, ask(), nested assuming() scopes, and And compound facts backed by one arena-local native context. Q.algebraic preserves SymPy 1.14.0's constructor-symbol and undecided-function boundaries while delegating mathematical classification to the native predicate owner."
difference = "The supported fact vocabulary and inference rules are narrower; explicit immutable Fortran contexts and the full SymPy predicate system remain incomplete. Conflicts are diagnosed and scopes are transactional."

[[semantic]]
id = "exact-number-construction"
affected = ["Integer", "Rational"]
parity = "partial"
sympy = "Integer and Rational preserve SymPy exact-number construction and canonicalization rules across supported Python inputs."
fortsym = "Integer uses the native exact representation; Rational accepts integer, Fraction, rational/decimal-string, finite-float, and native exact-number inputs, and maps zero denominators to native zoo/nan sentinels. Large integer values cross the C ABI as exact text."
difference = "The bounded adapter does not yet cover non-finite conversion, precision metadata, or every SymPy exact-domain constructor input."

[[semantic]]
id = "real-precision"
affected = ["Float"]
parity = "partial"
sympy = "Float carries arbitrary precision and precision-aware decimal semantics."
fortsym = "Float converts to a native double through the C ABI and therefore has fixed machine precision; finite Float values compare and hash like Python floats, while the native literal boundary retains IEEE negative zero."
difference = "Precision metadata and arbitrary-precision real evaluation are not yet equivalent. SymPy 1.14.0 canonicalizes Float(-0.0) to 0.0 for display, while fortsym preserves the IEEE sign bit for code-generation correctness."

[[semantic]]
id = "named-constants"
affected = ["pi", "E", "I", "oo", "zoo", "nan"]
parity = "partial"
sympy = "SymPy constants have dedicated exact types, evaluation, assumptions, and directed-infinity semantics."
fortsym = "The adapter creates native constant nodes named pi, e, i, oo, zoo, and nan; the native facade exposes oo_expr, zoo_expr, and nan_expr for the corresponding structural sentinels. Native simplification propagates nan through its declared arithmetic/function fragment, applies the finite-scalar and compact-rational directed-domain rules, handles normalized positive rational phases of -oo, direct sqrt/Abs/exp/log/sign/floor/ceiling/sinh/cosh/tanh/sin/cos/tan domain cases, and preserves unresolved NaN arguments in order-bearing Bessel and Legendre heads."
difference = "The names and structural construction are compatible, but exact constant evaluation, assumptions, and the remaining operation-specific infinity semantics remain partial. Unknown factors and unsafe rational branches remain opaque; the declared nan, finite directed-domain, compact-rational power, normalized -oo phase, and direct unary fragments match SymPy 1.14.0, including nan**0 = 1."

[[semantic]]
id = "evaluated-arithmetic"
affected = ["Add", "Mul", "Pow"]
parity = "partial"
sympy = "Add, Mul, and Pow canonicalize supported expressions and expose evaluate=False unevaluated forms."
fortsym = "The adapter constructs evaluated native arithmetic and refuses evaluate=False; the shared arena canonicalizes universal power identities (`x**0`, `x**1`, `1**x` outside sentinel exponents, and `sqrt(x)**2`) and maps `1**oo`, `1**zoo`, and `1**nan` to `nan` while retaining branch-sensitive powers."
difference = "Unevaluated-expression semantics, canonical ordering, domain rules, and broad power evaluation are narrower."

[[semantic]]
id = "applied-functions"
affected = ["Function", "sin", "cos", "tan", "asin", "acos", "atan", "atan2", "sinh", "cosh", "tanh", "csch", "sech", "coth", "erf", "erfc", "gamma", "loggamma", "factorial", "besselj", "besseli", "legendre", "asinh", "acosh", "atanh", "exp", "log", "sqrt", "Abs", "sign", "floor", "ceiling"]
parity = "partial"
sympy = "SymPy function classes apply function-specific evaluation, assumptions, rewrites, and special-function rules."
fortsym = "The adapter creates native applied-function nodes for the declared heads; direct domain rules for the supported elementary heads cover representable infinity sentinels, finite gamma-family poles, exact nonnegative factorials through factorial(1000), exact real unit-circle asin/acos values, exact real tangent atan values, exact real asinh(±1) values, exact asin(±i), acos(±i), atan(±i), atanh(±i), and acosh(±i) branch points, including sin(zoo)=cos(zoo)=tan(zoo)=nan, symbolic/integer besseli(order,-oo) phase rules, besseli(nan,-oo)=nan, and Legendre's integer-degree infinity identities, while unresolved NaN arguments in order-bearing heads, accumulation-bound outputs, function assumptions, and broad rewrites are refused or absent."
difference = "Applied heads are structurally compatible for the supported fragment, not a claim of SymPy's complete evaluation and rewrite behaviour."

[[semantic]]
id = "complex-domain-functions"
affected = ["re", "im", "Abs", "expand_complex", "conjugate", "arg"]
parity = "partial"
sympy = "SymPy evaluates real and imaginary projections, rectangular complex expansion, conjugation, modulus, and principal argument with broad assumptions, rewrites, branch, and algebraic-number support."
fortsym = "The adapter routes re, im, Abs, expand_complex, conjugate, and arg through the native fortsym_complexdom owner where the supported domain is decidable. Supported exact, algebraic, real-assumption, elementary, principal-branch, and direct oo/-oo/zoo/nan sentinel cases are evaluated; conjugate(zoo) remains an applied head, while unknown reality, unsupported branches, and Arg at decidable zero return UnsupportedOperationError, and Abs retains its unevaluated fallback."
difference = "The supported expression fragment and printer coverage are narrower than SymPy's complete complex-domain protocol; refusals are explicit rather than guessed."

[[semantic]]
id = "expression-object-model"
affected = ["Expr"]
parity = "partial"
sympy = "SymPy Expr exposes a large immutable object protocol, arbitrary expression properties, traversal, assumptions, and rich conversions."
fortsym = "Expr exposes the native handle operations needed by the declared subset, with arena checks, close(), and a limited method set."
difference = "The adapter is a deliberately small compatibility object, not a drop-in implementation of every Expr method or property."

[[semantic]]
id = "set-matrix-and-tensor-results"
affected = ["FiniteSet", "EmptySet", "Tuple", "Matrix", "det", "tensorproduct", "tensorcontraction"]
parity = "partial"
sympy = "SymPy uses immutable set, tuple, matrix, and tensor result objects with broad construction, indexing, algebra, and option semantics."
fortsym = "The adapter exposes native-owned FiniteSet/Tuple/Complement solve results and a singleton EmptySet result, bounded exact dense Matrix construction, operations, and 2-D row/column/block slicing, determinant transport, the declared tensor product/contraction fragment, and rank-one SpacetimeTensor slices."
difference = "The result classes and operations are bounded, exact, and refusal-driven; flat indexing, general matrix expressions, general tensor slicing, sparse forms, arbitrary tensor dimensions, and the remaining SymPy options are not yet covered."

[[semantic]]
id = "calculus-and-rational-transformations"
affected = ["cancel", "together", "apart", "collect", "integrate", "limit", "series", "linsolve"]
parity = "partial"
sympy = "SymPy provides broad rational transformations, integration, limits, series, and linear-system APIs with domain, condition, and option handling."
fortsym = "The adapter exposes the bounded native owners for exact rational normalization, partial fractions, collection, verified one-variable integration and limits, Taylor series, and square exact-rational one-right-hand-side linear solving."
difference = "Only the documented bounded fragments are supported; broader domains, conditions, free parameters, alternate matrix inputs, Laurent/asymptotic series, and unsupported options are explicit refusals."

[[semantic]]
id = "differentiation"
affected = ["diff", "Derivative"]
parity = "partial"
sympy = "SymPy supports broad derivative rules, inferred variables in convenience cases, unevaluated Derivative objects, and many options."
fortsym = "Declared variables are differentiated natively; repeated variables are supported and Derivative(evaluate=False) is a typed wrapper with doit()."
difference = "Variable inference, options, special-function rules, and the complete unevaluated object protocol are narrower."

[[semantic]]
id = "substitution"
affected = ["Expr", "Subs", "Wild"]
parity = "partial"
sympy = "SymPy supports ordered and simultaneous substitutions, mappings, sequences, and substitution options."
fortsym = "The adapter supports one old/new pair, SymPy-ordered mappings, `simultaneous=True` for non-cascading mappings, exact-node `Expr.xreplace`, exact non-wildcard `Expr.replace` with changed-match `map=True` and exact-option validation, exact non-wildcard `Expr.match`, and bounded `Wild` patterns with fixed structural slots, `exclude`, and `properties`; the native facade also exposes paired-sequence `subs_many`. Subs supports explicit old/new pairs followed by doit()."
difference = "Callable and wildcard replacement, commutative wildcard remainder partitioning, broad wildcard algebra, and the wider substitution option vocabulary remain partial; the declared ordered-mapping, simultaneous, exact-node, exact-replace, exact-match, and bounded-Wild fragments are differential-tested."

[[semantic]]
id = "sympification"
affected = ["sympify"]
parity = "partial"
sympy = "sympify accepts SymPy objects, Python values, strings containing expressions, and conversion protocols."
fortsym = "sympify accepts native expressions, scalar values, fractions, and identifier strings only."
difference = "Source-expression parsing and the broad SymPy conversion protocol are explicitly outside the adapter subset."

[[semantic]]
id = "expansion"
affected = ["expand"]
parity = "partial"
sympy = "SymPy expand has multiple algebraic, power, logarithmic, multinomial, and function options."
fortsym = "Native expansion is bounded and supports the implemented polynomial fragment; the adapter exposes no equivalent option vocabulary."
difference = "Supported algebraic forms, option semantics, and resource-bounded refusal differ."

[[semantic]]
id = "free-symbols"
affected = ["Expr"]
parity = "partial"
sympy = "SymPy Expr.free_symbols returns the distinct Symbol objects reachable from an expression."
fortsym = "The native arena traversal returns distinct NK_SYM names; the C ABI and Python Expr.free_symbols expose native symbol handles while excluding constants and applied-function heads."
difference = "The supported hierarchy is narrower than SymPy's full bound-symbol, indexed, set, and tuple model, and the C ABI name order is not semantic."

[[semantic]]
id = "operation-count"
affected = ["count_ops"]
parity = "partial"
sympy = "SymPy count_ops returns a scalar operation count or, with visual=True, an expression formed from operation symbols."
fortsym = "The native arena owns the non-visual tree count; n-ary sums and products count operand links, canonical reciprocal products count as divisions, and repeated shared children count per occurrence."
difference = "The visual=True operation-expression form is an explicit refusal until its native expression vocabulary and printer semantics are defined."

[[semantic]]
id = "simplification"
affected = ["simplify"]
parity = "partial"
sympy = "SymPy simplify is a broad heuristic transformation that may select different normal forms."
fortsym = "Native simplify applies guarded, resource-bounded rewrites, including principal-square-root powers, exact real unit-circle `asin`/`acos` values, exact real tangent `atan` values, exact real `asinh(±1)` values, exact negative perfect-square roots, exact `asin(±i)`, `acos(±i)`, and `asinh(±i)` branch points, exact `log(0)=zoo` with sentinel propagation, principal-branch exact negative-real and imaginary logarithms, exact `atan(±i)`, exact `atanh(1)`/`atanh(-1)` poles and `atanh(±i)` branch points, exact `acosh(0)`/`acosh(-1)` and `acosh(±i)` branch points, finite gamma-family poles, exact factorial values through `factorial(1000)`, and real/nonzero-guarded log/exp compositions, and returns the original or an unevaluated form when it cannot prove a transformation."
difference = "Normal-form choice, rewrite coverage, assumptions, and resource-limit outcomes are not identical."

[[semantic]]
id = "refinement"
affected = ["refine"]
parity = "partial"
sympy = "SymPy refine applies assumptions to expressions and can use its broad predicate, relational, and compound inference system."
fortsym = "The adapter accepts one or more supported Q facts or transactional And relations and routes them through a reversible native assumption scope and guarded simplifier, including signed and zero facts for sqrt/Abs refinement and real/nonzero facts for log/exp composition."
difference = "Only the native sign/zero facts plus bounded sign-implying relations and conjunctions are covered; the broader SymPy refine rules remain incomplete."

[[semantic]]
id = "relational-constructors"
affected = ["Eq", "Ne", "Gt", "Ge", "Lt", "Le", "And", "Or", "Not", "Xor", "Implies", "Equivalent"]
parity = "partial"
sympy = "SymPy exposes relational constructors, Boolean And/Or/Not/Xor/Implies/Equivalent compounds, and comparison operators with evaluated Boolean results where possible and symbolic relational objects otherwise."
fortsym = "The adapter exposes the same constructor spellings plus symbolic comparison operators as applications in the shared native expression owner. Exact numeric Eq/Ne/order relations and identical-expression Eq/Ne return Python booleans, while unknown symbolic ordering remains native-relational. It evaluates empty and Python-constant Boolean identities, maps relational Not to its complementary relation, and provides matching `&`, `|`, `^`, and `~` expression operators. Cross-arena operands are rejected."
difference = "Full Boolean simplification, arbitrary relational assumptions, and condition reduction remain narrower. SymPy 1.14 does not infer these relational facts in ask/refine; fortsym adds sound bounded sign/zero implications, conjunction inference, and explicit conflict diagnostics as native extensions."

[[semantic]]
id = "factorisation"
affected = ["factor"]
parity = "partial"
sympy = "SymPy factor handles broader polynomial domains and returns domain-aware factorizations."
fortsym = "Native factorisation is bounded; the C ABI and adapter refuse factorizations that would discard a domain condition."
difference = "Domain coverage, factor selection, conditions, and failure/refusal behaviour differ."

[[semantic]]
id = "equation-solving"
affected = ["solve", "solveset", "Complement"]
parity = "partial"
sympy = "SymPy's solveset returns a mathematical Set and preserves domain exclusions such as rational denominator zeros; solve has a separate list-oriented interface."
fortsym = "The native one-equation path verifies polynomial roots, transports verified rational numerator and denominator roots through the C ABI, and the Python facade renders symbolic exclusions as bounded Complement results."
difference = "Only the default complex finite polynomial/rational/scalar-linear fragment is implemented; real domains, ConditionSet, infinite solution sets, inequalities, and broader transcendental and radical families remain explicit refusals."

[[implementation]]
id = "expression-representation"
affected = ["all-supported"]
sympy = "Python objects form the SymPy expression graph."
fortsym = "A hash-consed native Fortran DAG is addressed through arena-local opaque handles."
difference = "Representation and identity are implementation differences; structural results remain the semantic comparison target."

[[implementation]]
id = "state-and-lifetime"
affected = ["all-supported"]
sympy = "SymPy does not require callers to manage a Fortran-style arena lifetime."
fortsym = "The Python facade retains an Arena per expression; the Fortran facade also offers process-local default state and explicit arenas, with stale handles after reset or close."
difference = "Ownership, lifetime, and concurrency boundaries differ even where expression results match."

[[implementation]]
id = "language-and-abi-boundary"
affected = ["all-supported"]
sympy = "SymPy runs in Python and calls Python-level implementations."
fortsym = "fortsym.sympy is a spelling adapter over a standard-library ctypes binding and the stable C ABI; the core semantics execute in Fortran."
difference = "Call overhead, error transport, memory ownership, and language-level introspection differ."

[[implementation]]
id = "numeric-backend"
affected = ["Integer", "Rational", "Float", "pi", "E", "I", "oo"]
sympy = "SymPy uses Python integers and its own exact and arbitrary-precision number classes."
fortsym = "The native path uses compact machine scalars where possible and exact textual/native representations for larger values; real ABI values use double precision."
difference = "Backend selection and precision strategy are implementation boundaries, with Float's precision limitation separately recorded as semantic."

[[implementation]]
id = "resource-bounds"
affected = ["Add", "Mul", "Pow", "expand", "simplify", "factor", "diff"]
sympy = "SymPy operations expose their own recursion, cache, and algorithmic limits."
fortsym = "Native operations use explicit node, term, degree, and time/resource guards and report refusal or UNKNOWN rather than guessing."
difference = "Resource policy and failure timing differ; a benchmark must compare successful supported workloads and refusal boundaries separately."

[[implementation]]
id = "engine-boundaries"
affected = ["simplify", "factor", "diff", "expand"]
sympy = "SymPy owns the reference implementation for the comparison."
fortsym = "The repository also contains separately classified native, SymEngine, Yacas, and out-of-process engine layers; the Python compatibility subset defaults to the native C ABI path."
difference = "Backend selection and delegation are implementation choices and must not silently change the declared adapter semantics."

[[implementation]]
id = "printing-and-introspection"
affected = ["all-supported"]
sympy = "SymPy provides rich printers, repr/eval protocols, class identity, and introspection."
fortsym = "The native facade exposes deterministic text, exact text, names, kinds, arity, and arguments for its smaller object model."
difference = "Textual output and available introspection are implementation differences unless a compatibility test explicitly promises a spelling."
