name: corpus

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  oracle-audit:
    name: SymPy + Mathics corpus audit
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Check out the benchmark corpus and harness
        uses: actions/checkout@v5
        with:
          repository: lazy-fortran/fortsym-bench
          ref: main
          path: bench

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the native Wolfram runner
        run: |
          nix develop --command cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DFORTSYM_BUILD_TESTING=OFF
          nix develop --command cmake --build build --target fortsym_wl_run -j

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bench/pyproject.toml

      - name: Install the corpus harness and open-source oracles
        run: python -m pip install --quiet "./bench[dev,mathics]"

      # A cold corpus audit records known oracle errors, timeouts, and
      # disagreements as coverage data. They must not hide the report by
      # preventing the artifact upload.
      - name: Run corpus against both independent oracles
        continue-on-error: true
        run: |
          mkdir -p artifacts
          # shellcheck disable=SC2016
          nix develop --command bash -c '
            set -eu
            export PATH="$GITHUB_WORKSPACE/build/bin:$PATH"
            fortsym-bench run bench/corpus \
              --backend sympy mathics fortsym-wl \
              --jobs 4 \
              --timeout 60 \
              --report artifacts/fortsym-corpus.json
          '

      - name: Publish the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortsym-corpus-${{ github.sha }}
          path: artifacts/fortsym-corpus.json

  release-audit:
    name: Publish release coverage report
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check out the benchmark corpus and harness
        uses: actions/checkout@v5
        with:
          repository: lazy-fortran/fortsym-bench
          ref: main
          path: bench

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the native Wolfram runner
        run: |
          nix develop --command cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DFORTSYM_BUILD_TESTING=OFF
          nix develop --command cmake --build build --target fortsym_wl_run -j

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bench/pyproject.toml

      - name: Install the corpus harness and open-source oracles
        run: python -m pip install --quiet "./bench[dev,mathics]"

      - name: Run corpus against both independent oracles
        continue-on-error: true
        run: |
          mkdir -p artifacts
          # shellcheck disable=SC2016
          nix develop --command bash -c '
            set -eu
            export PATH="$GITHUB_WORKSPACE/build/bin:$PATH"
            fortsym-bench run bench/corpus \
              --backend sympy mathics fortsym-wl \
              --jobs 4 \
              --timeout 60 \
              --report artifacts/fortsym-corpus.json
          '

      - name: Attach the coverage report to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" \
          artifacts/fortsym-corpus.json \
          --repo "${{ github.repository }}" \
          --clobber
