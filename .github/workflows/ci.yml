name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The toolchain comes from flake.nix, not from the runner image. fortsym pins
# FLINT and MPFR to exact versions and needs SymEngine, and no distribution
# repository carries that combination -- the previous apt-based workflow could
# not install SymEngine at all. Nix resolves the whole closure from flake.lock,
# so CI compiles against the same libraries a contributor does.
#
# Two caches keep that cheap. The Nix store cache restores the toolchain instead
# of re-downloading it, and ccache covers the one large C++ build in the tree:
# Yacas, which cmake/deps/yacas.cmake fetches at a pinned tag and which
# therefore recompiles identically every run. Fortran is deliberately left off
# the compiler launcher, because module files are side effects ccache does not
# track.
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M

jobs:
  python-package:
    name: Python wheel + clean virtualenv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the native shared library
        run: |
          nix develop --command cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DFORTSYM_BUILD_TESTING=OFF
          nix develop --command cmake --build build -j

      - name: Build and install the wheel in a clean environment
        run: |
          # shellcheck disable=SC2016
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet build
          .venv/bin/python -m build --wheel --outdir wheelhouse python
          .venv/bin/python -m pip install --quiet wheelhouse/*.whl
          # shellcheck disable=SC2016
          nix develop --command bash -c '
            set -eu
            library_path="$GITHUB_WORKSPACE/build/lib"
            for flag in $NIX_LDFLAGS; do
              case "$flag" in
                -L*) library_path="$library_path:${flag#-L}" ;;
              esac
            done
            export LD_LIBRARY_PATH="$library_path${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            export FORTSYM_LIBRARY="$GITHUB_WORKSPACE/build/lib/libfortsym.so"
            exec .venv/bin/python -
          ' <<'PY'
          from fractions import Fraction
          import fortsym
          import fortsym.sympy as sp

          x = fortsym.Symbol("x")
          assert str(((x + 1) ** 2).expand()) == "x**2 + 2*x + 1"
          assert "1/3" in str(x + Fraction(1, 3))
          assert fortsym.Integer(2**100).exact_text == str(2**100)
          sx = sp.Symbol("x")
          assert isinstance(sx + 1, sp.Add)
          assert sp.simplify(sp.diff(sp.exp(sx), sx)) == sp.exp(sx)
          PY

  provenance:
    name: compatibility provenance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check new compatibility sources
        run: |
          git diff --name-only --diff-filter=A \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            > changed-files.txt
          python3 scripts/check_provenance.py \
            --changed-files changed-files.txt \
            --provenance doc/provenance.md

  # Tier 1 only: the configuration every contributor and every consumer must be
  # able to build. No optional engine is installed here on purpose, so a change
  # that quietly starts depending on Maxima or SymPy fails this job.
  cmake:
    name: cmake + ctest (Tier 1 only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-tier1-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-tier1-${{ runner.os }}-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-tier1-${{ runner.os }}-
          purge-created: 604800

      - uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-tier1-${{ runner.os }}-${{ hashFiles('cmake/deps/yacas.cmake') }}-${{ github.sha }}
          restore-keys: |
            ccache-tier1-${{ runner.os }}-${{ hashFiles('cmake/deps/yacas.cmake') }}-
            ccache-tier1-${{ runner.os }}-

      - name: Configure
        run: |
          nix develop --command cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: nix develop --command cmake --build build -j

      - name: Test
        run: |
          # shellcheck disable=SC2016
          nix develop --command bash -c '
            set -eu
            library_path="$GITHUB_WORKSPACE/build/lib"
            for flag in $NIX_LDFLAGS; do
              case "$flag" in
                -L*) library_path="$library_path:${flag#-L}" ;;
              esac
            done
            export LD_LIBRARY_PATH="$library_path${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            exec ctest --test-dir build --output-on-failure
          '

  # With the optional engines present, so the council actually has several
  # voters and the cross-engine oracle is exercised. Not required: a Tier 2
  # engine changing its output must not break the build for everyone.
  multi-engine:
    name: cmake + ctest (with Tier 2 engines)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-tier2-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-tier2-${{ runner.os }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-tier2-${{ runner.os }}-
          purge-created: 604800

      - uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-tier2-${{ runner.os }}-${{ hashFiles('cmake/deps/yacas.cmake') }}-${{ github.sha }}
          restore-keys: |
            ccache-tier2-${{ runner.os }}-${{ hashFiles('cmake/deps/yacas.cmake') }}-
            ccache-tier2-${{ runner.os }}-

      - name: Configure
        run: |
          nix develop .#tier2 --command cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: nix develop .#tier2 --command cmake --build build -j

      - name: Test
        run: nix develop .#tier2 --command ctest --test-dir build --output-on-failure

      # The council prints a per-engine benchmark table as a by-product of its
      # own test run, so speed comparisons need no separate harness.
      - name: Benchmark table
        run: nix develop .#tier2 --command ./build/bin/test_fortsym_council

  # Generated kernels are committed so they are reviewable in diffs and so
  # consumers need no CAS to build. This job regenerates them and fails on any
  # difference, which is what makes "generated code, lost generator" structurally
  # impossible rather than merely discouraged.
  generated-up-to-date:
    name: generated sources are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-generated-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-generated-${{ runner.os }}-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-generated-${{ runner.os }}-
          purge-created: 604800

      - uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-generated-${{ runner.os }}-${{ hashFiles('cmake/deps/yacas.cmake') }}-${{ github.sha }}
          restore-keys: |
            ccache-generated-${{ runner.os }}-${{ hashFiles('cmake/deps/yacas.cmake') }}-
            ccache-generated-${{ runner.os }}-

      - name: Configure and build generators
        run: |
          nix develop --command cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          nix develop --command cmake --build build -j

      # Each committed file names the program that produced it in its header, so
      # the gate is driven by the files themselves. A glob over build/bin/gen_*
      # would be wrong: most generators write into a consumer's tree and take the
      # output path as an argument, and running those here only proves that they
      # reject an empty command line.
      - name: Regenerate and diff
        run: |
          set -euo pipefail
          shopt -s nullglob
          generated=(src/generated/*.f90)
          if [ ${#generated[@]} -eq 0 ]; then
            echo "no generated sources yet; nothing to regenerate"
            exit 0
          fi
          for file in "${generated[@]}"; do
            gen=$(sed -n 's/^! Generator: //p' "$file" | head -n 1)
            if [ -z "$gen" ]; then
              echo "$file carries no '! Generator:' header line" >&2
              exit 1
            fi
            if [ ! -x "build/bin/$gen" ]; then
              echo "$file names generator '$gen', which the build did not produce" >&2
              exit 1
            fi
            echo "regenerating $file with $gen"
            "build/bin/$gen"
          done
          git diff --exit-code -- src/generated
