[workloads]
semantic_domain = "Exact real and complex algebraic numbers over Q, bounded to degree 32 and coefficient height 4096 bits by the bridge."
normalization = "Irreducible x^2-2, reducible (x^2-2)(x-3), and repeated (x-1)^2 inputs. Oracle: exact reduced minimal polynomial/root or defining equation plus exact signs."
gaussian_construct = "1/2 + 3i/4. Oracle: minimal polynomial 16x^2-16x+13; direct row uses trace 1, norm 13/16, and positive component signs."
arithmetic = "Trace z+conj(z)=1, norm z*conj(z)=13/16, and (1+i)/(1-i)=i."
conjugate = "1/2-3i/4. Oracle: exact trace 1 and product 13/16 with positive real and negative imaginary signs."
signed_power = "(1+i)^8=16."
principal_sqrt = "sqrt(-2) squares to -2 and has zero real, positive imaginary component."
component_signs = "Exact component signs of principal sqrt(-2) are (0,+1)."
resource_refusal = "A 65,501-digit real component is below the 64 KiB text cap but above the 4096-bit algebraic-height cap; the bridge must return empty with ok=false."
output_coverage = "Each timed bridge call includes text validation, FLINT reconstruction, operation, canonical serialization, and immediate fetch; its independent oracle runs outside the timed region. Direct rows omit text and ABI work. Every persisted row reports correct=true."

