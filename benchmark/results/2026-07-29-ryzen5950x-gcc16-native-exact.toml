before_reproduction_commands = [
  "git worktree add --detach /tmp/fortsym-native-exact-before bf466b0851f79fa4fd1f81bcfb76a0eedfba770f",
  "cd /tmp/fortsym-native-exact-before && taskset -c 0 fo exec bench_native > /tmp/fortsym-native-bf466b0.csv",
]
after_reproduction_commands = [
  "git worktree add --detach /tmp/fortsym-native-exact-after e2b4c90240abfad33395dc844f1e6b525bdca9ad",
  "cd /tmp/fortsym-native-exact-after && taskset -c 0 fo exec bench_native > /tmp/fortsym-native-e2b4c90.csv",
]
csv_assembly = "Preserve every raw measurement field, replace schema=1 with schema=2, and prefix each row with variant and its worktree revision."

[workloads]
semantic_domain = "Commutative scalar expressions over exact rationals and real64 shifts; no assumptions."
simplify_collect = "Warm input x+x+2*x-4*x+1/2+1/3-5/6; cold inputs add a distinct symbol and its negation. Oracle: exact zero node."
differentiate_power = "Warm input (x+1)^8; cold inputs (x+k*1e-6)^8. Oracle: centered finite difference at x=0.375, y=-0.5 with relative tolerance 1e-7."
expand_power = "Warm input (x+y+1)^7; cold inputs (x+y+k*1e-6)^7. Oracle: independent evaluation of input and expansion at x=0.375, y=-0.5 with relative tolerance 1e-12."
output_coverage = "One result expression per invocation; every persisted row reports a successful operation and a passing oracle."

[warm_same_expression]
warmups = 5
repetitions = 31
batch = 50

[cold_distinct_expression]
warmups = 2
repetitions = 11
batch = 10

