[protocol]
description = "Unmodified committed benchmark application at each revision; native and SymEngine each run the same suite in a separate fresh arena."
before_raw_sha256 = "1b27519e496d1a9a18283ced346893bb67d27b9fd2234dc66ffcfe4e6301898e"
after_raw_sha256 = "ba8681a582bfd438b793805eee69b2e04699ec6d4cc1ad8d247fb68ba7fa5001"
